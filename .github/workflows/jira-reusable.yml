name: Jira strict transition

on:
  workflow_call:
    inputs:
      staging-branch:
        type: string
        default: staging
      main-branch:
        type: string
        default: main
    secrets:
      jira-base-url:
        required: true
      jira-user:
        required: true
      jira-api-token:
        required: true
      discord-webhook-url:
        required: true

jobs:
  transition-jira:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout workflow code
        uses: actions/checkout@v5
        with:
          # A reusable workflow checks out the caller repository by default.
          # This explicit repository is required because jira-workflow.js lives
          # in the central workflow repository.
          repository: jncalderon/github-jira-workflows
          ref: main
      - name: Resolve and transition Jira tickets
        uses: actions/github-script@v8
        env:
          JIRA_BASE_URL: ${{ secrets.jira-base-url }}
          JIRA_USER: ${{ secrets.jira-user }}
          JIRA_API_TOKEN: ${{ secrets.jira-api-token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.discord-webhook-url }}
          STAGING_BRANCH: ${{ inputs.staging-branch }}
          MAIN_BRANCH: ${{ inputs.main-branch }}
        with:
          script: |
            const { eventContext, processTickets } = require(`${process.env.GITHUB_WORKSPACE}/src/jira-workflow.js`);
            const payload = structuredClone(context.payload);
            if (context.eventName === 'pull_request' && payload.action === 'closed' && payload.pull_request?.merged) {
              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: payload.pull_request.number,
                per_page: 100
              });
              payload.pull_request.commits = commits.map(commit => ({ message: commit.commit.message }));
              for (const commit of commits) {
                const associated = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: commit.sha,
                  per_page: 100
                });
                for (const pull of associated) {
                  payload.pull_request.commits.push({ message: pull.head?.ref });
                }
              }
            }
            const transitionContext = eventContext(payload, context.eventName, process.env.STAGING_BRANCH, process.env.MAIN_BRANCH);
            await processTickets(transitionContext, {
              baseUrl: process.env.JIRA_BASE_URL,
              user: process.env.JIRA_USER,
              token: process.env.JIRA_API_TOKEN,
              discordWebhookUrl: process.env.DISCORD_WEBHOOK_URL
            }, core);
